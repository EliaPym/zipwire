name: CI

on:
   pull_request:
      branches: main
   push:
      branches: "**"

permissions:
   contents: read

jobs:
   ci:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v7
         - uses: actions/setup-node@v7
           with:
              node-version: 24
              cache: npm
         - run: npm ci
         - run: npm run lint -- --deny-warnings
         - run: npm run build -w web
         - run: npm run typecheck -w server
         - run: npm test
